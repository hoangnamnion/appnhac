name: Build All Platforms (Windows, Android, iOS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD WINDOWS DESKTOP (.EXE)
  # ==========================================
  build-windows:
    name: 💻 Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: node build-www.js

      - name: Build Windows Executable
        run: npx electron-builder --win --x64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinTag-Music-Windows-Setup
          path: |
            dist-electron/*.exe
          retention-days: 30

  # ==========================================
  # JOB 2: BUILD ANDROID APP (.APK)
  # ==========================================
  build-android:
    name: 🤖 Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets & Sync Capacitor Android
        run: |
          node build-www.js
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug / Direct Install)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinTag-Music-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ==========================================
  # JOB 3: BUILD IOS APP (.IPA)
  # ==========================================
  build-ios:
    name: 🍎 Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets & Sync Capacitor iOS
        run: |
          node build-www.js
          npx cap sync ios

      - name: Build iOS Archive (Unsigned / Ad-hoc)
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package into IPA (Payload format for Sideloading)
        run: |
          cd ios/App/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../../../ShinTag-Music-iOS.ipa Payload
          cd ../../../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinTag-Music-iOS
          path: ShinTag-Music-iOS.ipa
          retention-days: 30
