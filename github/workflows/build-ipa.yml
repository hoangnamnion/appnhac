name: 📱 Auto Build iOS .IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút Build thủ công bất cứ lúc nào trên GitHub

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: 📥 1. Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 3. Cài đặt Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ 4. Khởi tạo Capacitor iOS Project
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🔧 5. Cấu hình Info.plist (Audio Chạy Nền & Quyền Chọn Ảnh)
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'ShinTag cần truy cập ảnh để bạn chọn ảnh bìa cho bài hát.'" "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'ShinTag cần truy cập ảnh để bạn chọn ảnh bìa cho bài hát.'" "$PLIST_PATH" 2>/dev/null || true
          fi

      - name: 🔨 6. Build App với Xcode (Unsigned / Sideload Ready)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 📦 7. Đóng gói thành file .IPA chuẩn
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ShinTag-Music.ipa Payload
          mv ShinTag-Music.ipa $GITHUB_WORKSPACE/

      - name: 🚀 8. Upload File .IPA làm Artifact để tải về
        uses: actions/upload-artifact@v4
        with:
          name: ShinTag-Music-iOS-IPA
          path: ShinTag-Music.ipa
          retention-days: 30
