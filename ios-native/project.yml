name: ShinTag
options:
  bundleIdPrefix: com.musictag
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.musictag.sync
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  ShinTag:
    type: application
    platform: iOS
    sources:
      - ShinTag
    resources:
      - ShinTag/Resources
    info:
      path: ShinTag/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppleMusicUsageDescription: "Cần truy cập thư viện nhạc để nhập bài hát."
        NSPhotoLibraryUsageDescription: "Cần truy cập ảnh để chọn ảnh bìa."
        UIBackgroundModes:
          - audio
        NSFileProviderDomainUsageDescription: "Cần truy cập Files để nhập file nhạc."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musictag.sync

packages:
  ID3TagEditor:
    url: https://github.com/chicio/ID3TagEditor
    from: "4.5.0"
